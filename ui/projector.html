<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiteStream - Program Output</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#05070a;color:#eef4f7;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}
canvas{width:100%;height:100%;object-fit:contain;display:block;background:#05070a}
.bar{position:absolute;z-index:2;inset:0 0 auto;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;background:linear-gradient(#080d12ed,#080d12b0,transparent);transition:opacity .2s}
.brand{font-size:12px;font-weight:700;letter-spacing:.3px}
.status{font-size:10px;color:#78ddc8;margin-left:9px}
.status.bad{color:#ff8a8a}
.actions{display:flex;gap:7px}
.actions button{border:1px solid #3b4b56;background:#111a22;color:#e8f2f5;border-radius:6px;padding:6px 9px;font-size:11px;cursor:pointer}
.actions button:hover{border-color:#61d7c1}
html:fullscreen .bar{opacity:0}
html:fullscreen:hover .bar{opacity:1}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">LiteStream <span class="status" id="stat">WAITING FOR SIGNAL</span></div>
  <div class="actions"><button id="full">Fullscreen</button><button id="close">Close output</button></div>
</div>
<canvas id="feed" width="1280" height="720"></canvas>
<script>
(function(){
  var T=window.__TAURI__,ev=T&&T.event,inv=T&&T.core&&T.core.invoke;
  var cv=document.getElementById('feed'),ctx=cv.getContext('2d'),stat=document.getElementById('stat');
  var busy=false,pending=null,count=0,lastFrame=0;
  function render(url){
    if(busy){pending=url;return}
    busy=true;
    var img=new Image();
    img.onload=function(){
      if(cv.width!==img.naturalWidth||cv.height!==img.naturalHeight){cv.width=img.naturalWidth;cv.height=img.naturalHeight}
      ctx.drawImage(img,0,0);count++;lastFrame=Date.now();busy=false;
      if(pending){var p=pending;pending=null;render(p)}
    };
    img.onerror=function(){busy=false};
    img.src=url;
  }
  if(ev)ev.listen('ls-frame',function(e){render(e.payload)});
  setInterval(function(){
    var live=Date.now()-lastFrame<2000;
    stat.textContent=live?('LIVE \u00B7 '+count+' fps'):'NO SIGNAL';
    stat.className='status'+(live?'':' bad');count=0;
  },1000);
  function alive(){if(ev)ev.emitTo('main','ls-alive',1)}
  alive();setInterval(alive,1000);
  function toggleFull(){
    if(document.fullscreenElement){document.exitFullscreen()}
    else{document.documentElement.requestFullscreen().catch(function(){})}
  }
  document.getElementById('full').onclick=toggleFull;
  cv.ondblclick=toggleFull;
  document.getElementById('close').onclick=function(){
    if(ev)ev.emitTo('main','ls-closed',1);
    if(inv){inv('close_projector')}else{window.close()}
  };
})();
</script>
</body>
</html>
