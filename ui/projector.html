<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiteStream - Program Output</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#05070a;color:#eef4f7;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}
canvas{width:100%;height:100%;object-fit:contain;display:block;background:#05070a}
.bar{position:absolute;z-index:2;inset:0 0 auto;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;background:linear-gradient(#080d12ed,#080d12b0,transparent);transition:opacity .2s}
.brand{font-size:12px;font-weight:700;letter-spacing:.3px}
.status{font-size:10px;color:#78ddc8;margin-left:9px}
.status.bad{color:#ff8a8a}
.actions{display:flex;gap:7px}
.actions button{border:1px solid #3b4b56;background:#111a22;color:#e8f2f5;border-radius:6px;padding:6px 9px;font-size:11px;cursor:pointer}
.actions button:hover{border-color:#61d7c1}
html:fullscreen .bar{opacity:0}
html:fullscreen:hover .bar{opacity:1}
.bar{opacity:0;pointer-events:none}
.bar.show{opacity:1;pointer-events:auto}
body{cursor:none}
body.active{cursor:default}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">LiteStream <span class="status" id="stat">WAITING FOR SIGNAL</span></div>
  <div class="actions"><button id="full">Fullscreen</button><button id="close">Close output</button></div>
</div>
<canvas id="feed" width="1280" height="720"></canvas>
<script>
(function(){
  var T=window.__TAURI__,ev=T&&T.event,inv=T&&T.core&&T.core.invoke;
  var ch=typeof BroadcastChannel==='function'?new BroadcastChannel('litestream-projector'):null;
  var cv=document.getElementById('feed'),ctx=cv.getContext('2d'),stat=document.getElementById('stat');
  var busy=false,pending=null,count=0,lastFrame=0,viaCh=false,via='';
  function paint(src,w,h){
    if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
    ctx.drawImage(src,0,0);count++;lastFrame=Date.now();
  }
  function next(){busy=false;if(pending){var p=pending;pending=null;render(p)}}
  function render(src){
    if(busy){pending=src;return}
    busy=true;
    if(typeof src==='string'){
      var img=new Image();
      img.onload=function(){paint(img,img.naturalWidth,img.naturalHeight);next()};
      img.onerror=next;img.src=src;
    }else{
      createImageBitmap(src).then(function(b){paint(b,b.width,b.height);b.close();next()}).catch(next);
    }
  }
  if(ch)ch.onmessage=function(e){
    var d=e.data;
    if(d&&d.type==='frame'&&d.blob){
      if(!viaCh){viaCh=true;ch.postMessage({type:'got'})}
      via='channel';render(d.blob);
    }
  };
  if(ev)ev.listen('ls-frame',function(e){if(!viaCh){via='event';render(e.payload)}});
  setInterval(function(){
    var live=Date.now()-lastFrame<2000;
    stat.textContent=live?('LIVE \u00B7 '+count+' fps \u00B7 '+via):'NO SIGNAL';
    stat.className='status'+(live?'':' bad');count=0;
  },1000);
  function alive(){if(ch)ch.postMessage({type:'alive'});if(ev)ev.emit('ls-alive',1)}
  alive();setInterval(alive,1000);
  function toggleFull(){
    if(document.fullscreenElement){document.exitFullscreen()}
    else{document.documentElement.requestFullscreen().catch(function(){})}
  }
  document.getElementById('full').onclick=toggleFull;
  cv.ondblclick=toggleFull;
  var hideT=null,bar=document.querySelector('.bar');
  document.addEventListener('mousemove',function(){
    bar.classList.add('show');document.body.classList.add('active');
    clearTimeout(hideT);hideT=setTimeout(function(){bar.classList.remove('show');document.body.classList.remove('active')},2500);
  });
  document.getElementById('close').onclick=function(){
    if(ch)ch.postMessage({type:'closed'});
    if(ev)ev.emit('ls-closed',1);
    if(inv){inv('close_projector')}else{window.close()}
  };
})();
</script>
</body>
</html>
